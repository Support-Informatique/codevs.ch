    <!-- Hero intro: hides what the intro animates before the first paint; the 3 s timer
         is a fail-safe that shows everything (src/components/home/Hero/useIntroPen.ts) -->
    <script>
      if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
        document.documentElement.classList.add('intro')
        setTimeout(function () {
          document.documentElement.classList.add('intro-go', 'intro-end')
        }, 3000)
      }
    </script>
